<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><meta name="theme-color" content="#3f5c46"/><meta name="description" content="A little music escape. Retro handheld player, album-colored rooms, live synced lyrics and a radio that follows your mood."/>
<link rel="manifest" href="/manifest.webmanifest"/><link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Looproom"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Looproom — a little music escape</title>
<!-- App-open intro: painted before any JS so there is no white flash; main.jsx plays the exit. -->
<style>
 html{background:#3f5c46}
 #splash{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;background:radial-gradient(ellipse at 30% 20%,#7e9a7d 0%,#3f5c46 55%,#24382b 100%);transition:opacity .55s ease .1s}
 #splash img{width:112px;height:112px;border-radius:26px;box-shadow:0 24px 60px -18px #000a,inset 0 0 0 1px #ffffff2e;animation:splash-pop .9s cubic-bezier(.2,1.5,.4,1) both;transition:transform .65s cubic-bezier(.6,0,.2,1)}
 #splash span{font-size:30px;font-weight:800;letter-spacing:-.04em;animation:splash-rise .8s cubic-bezier(.22,1,.36,1) .3s both}
 #splash i{display:block;width:120px;height:6px;border:1.5px solid #ffffffb0;border-radius:2px;overflow:hidden;animation:splash-rise .6s ease .5s both}
 #splash b{display:block;height:100%;background:#fff;transform-origin:left;animation:splash-load 1.1s steps(10) .6s both}
 #splash.is-leaving{opacity:0;pointer-events:none}
 #splash.is-leaving img{transform:scale(1.6)}
 @keyframes splash-pop{0%{opacity:0;transform:scale(.4) rotate(-8deg)}100%{opacity:1;transform:none}}
 @keyframes splash-rise{from{opacity:0;transform:translateY(14px);filter:blur(8px)}}
 @keyframes splash-load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
 @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash img{transition:none}}
</style></head><body>
<div id="splash" aria-hidden="true"><img src="/icons/icon-192.png" alt=""/><span>looproom</span><i><b></b></i></div>
<!-- Play the intro once per app session (a new tab or a launch from the home screen). -->
<script>try{if(sessionStorage.getItem('looproom-intro'))document.getElementById('splash').remove();else sessionStorage.setItem('looproom-intro','1')}catch(e){}</script>
<div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
